services:
  frontend:
    build:
      context: .
      target: builder
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_SSR_API_URL=http://host.docker.internal:8000/api/v1
      - VITE_UPLOAD_PUBLIC_URL=http://localhost:9000/shisha-guid
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
