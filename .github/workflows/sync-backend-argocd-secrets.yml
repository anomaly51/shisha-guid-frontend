name: Sync backend ArgoCD secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: arc-runner-set
    steps:
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            exit 0
          fi

          mkdir -p "${RUNNER_TEMP}/gh"
          case "$(uname -m)" in
            x86_64|amd64)
              gh_arch=amd64
              ;;
            aarch64|arm64)
              gh_arch=arm64
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v2.79.0/gh_2.79.0_linux_${gh_arch}.tar.gz" \
            -o "${RUNNER_TEMP}/gh/gh.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gh/gh.tar.gz" -C "${RUNNER_TEMP}/gh" --strip-components=1
          echo "${RUNNER_TEMP}/gh/bin" >> "$GITHUB_PATH"

      - name: Sync secrets
        env:
          GH_TOKEN: ${{ secrets.BACKEND_SECRET_SYNC_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          ARGOCD_INSECURE: ${{ secrets.ARGOCD_INSECURE }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing BACKEND_SECRET_SYNC_TOKEN}"
          : "${ARGOCD_SERVER:?Missing ARGOCD_SERVER}"
          : "${ARGOCD_USERNAME:?Missing ARGOCD_USERNAME}"
          : "${ARGOCD_PASSWORD:?Missing ARGOCD_PASSWORD}"
          : "${ARGOCD_INSECURE:?Missing ARGOCD_INSECURE}"

          printf '%s' "$ARGOCD_SERVER" | gh secret set ARGOCD_SERVER --repo anomaly51/shisha-guid-backend
          printf '%s' "$ARGOCD_USERNAME" | gh secret set ARGOCD_USERNAME --repo anomaly51/shisha-guid-backend
          printf '%s' "$ARGOCD_PASSWORD" | gh secret set ARGOCD_PASSWORD --repo anomaly51/shisha-guid-backend
          printf '%s' "$ARGOCD_INSECURE" | gh secret set ARGOCD_INSECURE --repo anomaly51/shisha-guid-backend
