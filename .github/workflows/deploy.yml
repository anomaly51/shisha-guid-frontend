name: Build and deploy
# Triggering this workflow updates the frontend image and GitOps application state.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shisha-frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: anomaly51/github-actions-toolkit/.github/workflows/harbor-argocd-app.yml@main
    with:
      app-name: shisha-frontend
      image-repository: harbor.api-api-api.com/shisha/frontend
    secrets: inherit
