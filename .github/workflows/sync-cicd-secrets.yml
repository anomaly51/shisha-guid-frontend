name: Sync CI/CD secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: arc-runner-set
    steps:
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          case "$(uname -m)" in
            x86_64|amd64) gh_asset=gh_2.83.1_linux_amd64.tar.gz ;;
            aarch64|arm64) gh_asset=gh_2.83.1_linux_arm64.tar.gz ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.83.1/${gh_asset}" -o "${RUNNER_TEMP}/gh.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gh.tar.gz" -C "${RUNNER_TEMP}"
          cp "${RUNNER_TEMP}"/gh_*/bin/gh "${RUNNER_TEMP}/bin/gh"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Sync secrets
        env:
          GH_TOKEN: ${{ secrets.CICD_SECRET_SYNC_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          ARGOCD_INSECURE: ${{ secrets.ARGOCD_INSECURE }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            online-shop-frontend-v2
            architect-business-bot
            bot_motivation
            downloader_sloniara_bot
          )
          for repo in "${repos[@]}"; do
            gh -R "anomaly51/${repo}" secret set ARGOCD_SERVER --body "$ARGOCD_SERVER"
            gh -R "anomaly51/${repo}" secret set ARGOCD_USERNAME --body "$ARGOCD_USERNAME"
            gh -R "anomaly51/${repo}" secret set ARGOCD_PASSWORD --body "$ARGOCD_PASSWORD"
            gh -R "anomaly51/${repo}" secret set ARGOCD_INSECURE --body "$ARGOCD_INSECURE"
            gh -R "anomaly51/${repo}" secret set HARBOR_USERNAME --body "$HARBOR_USERNAME"
            gh -R "anomaly51/${repo}" secret set HARBOR_PASSWORD --body "$HARBOR_PASSWORD"
          done
